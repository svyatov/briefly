version: 2
updates:
  # Dependabot refreshes Gemfile.lock only. It finds lockfiles by name, and
  # `gemfiles/rails_8.0.gemfile.lock` is not a name it parses, so the three Rails matrix
  # locks are left behind. Run `bundle exec rake lock:refresh` to relock all four. A
  # `directories:` entry for `/gemfiles` does not help: the bundler fetcher matches the
  # exact name `Gemfile` per directory, so it finds nothing there.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      bundler:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
