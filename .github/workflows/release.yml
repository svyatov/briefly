name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# `bundler-cache: true` would set frozen mode for us, but it also restores a cache, which is a
# poisoning vector in a workflow that can authenticate to rubygems.org. Setting frozen mode here
# keeps the half worth keeping: the test job installs what Gemfile.lock records or fails, and
# nothing in this workflow restores anything.
env:
  BUNDLE_FROZEN: "true"

jobs:
  # No Bundler cache anywhere in this workflow, including here: a restored cache is a
  # cache-poisoning vector in a tag-triggered publish, and a release is rare enough to pay for it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - run: bundle install
      - run: bundle exec rake

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: Check the tag against Briefly::VERSION
        run: |
          ruby -e '
            require_relative "lib/briefly/version"
            tag = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            abort "tag #{tag} does not match Briefly::VERSION #{Briefly::VERSION}" unless tag == Briefly::VERSION
            puts "tag #{tag} matches Briefly::VERSION"
          '

      - run: mkdir -p pkg && gem build briefly.gemspec --output pkg/briefly.gem

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-gem
          path: pkg/briefly.gem
          retention-days: 1

  # Holds the only credential in this workflow, so it runs no project code: it downloads the gem
  # the build job produced, signs it, and pushes it. `environment: release` is what gates it on a
  # person, and it is also the value the rubygems.org trusted publisher entry matches on.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-gem
          path: pkg/

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Signs the exact bytes the build job produced, using this run's ambient OIDC identity, rather
      # than relying on implicit signing that varies by RubyGems client version.
      - run: gem exec --conservative sigstore-cli:0.2.3 sign pkg/briefly.gem --bundle pkg/briefly.gem.sigstore.json
      - run: gem push pkg/briefly.gem --attestation pkg/briefly.gem.sigstore.json

  # The release carries notes and nothing else. The gem is on rubygems.org, which serves back the
  # sigstore attestation the publish job pushed, so attaching a copy here would be a second artifact
  # to verify with no second thing proved, and it would pull in an SBOM and a signed hash manifest
  # to describe it. A third job all the same: it holds `contents: write`, which the credentialed
  # publish job must not, and `needs: [publish]` keeps even the notes behind the approval gate.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Generated notes are a list of merged pull requests, which says something different from
      # what the changelog says about the same release. Take the changelog's own words instead, and
      # fail rather than publish a release describing nothing.
      - name: Take the release body from CHANGELOG.md
        run: |
          ruby -e '
            version = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            section = File.read("CHANGELOG.md")[/^## v#{Regexp.escape(version)} \([^)]*\)\n(.*?)(?=^## |\z)/m, 1]
            abort "CHANGELOG.md has no section for v#{version}" if section.nil? || section.strip.empty?
            File.write("RELEASE_NOTES.md", "#{section.strip}\n")
          '

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
